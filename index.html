<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BLOCK REALMS — 3D Browser Voxel Survival & Creative Odyssey | Developed by MOHAMMAD FAHAD</title>
  <meta name="description" content="BLOCK REALMS: An original 3D browser voxel sandbox survival and creative game developed by MOHAMMAD FAHAD. Featuring procedural terrain, flight, animated character, mining, crafting, mobs, and world saving." />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Three.js WebGL Canvas Holder -->
  <div id="game-canvas-container"></div>

  <!-- In-game Heads-Up Display (Crosshair, Hearts, Hunger, XP, Hotbar) -->
  <div id="hud-container"></div>

  <!-- Inventory & Container Modals (2x2 & 3x3 Crafting, Chests, Furnaces) -->
  <div id="inventory-modal-container"></div>

  <!-- Menus (Title Screen, New World, Saved Worlds, Settings, Pause, Death) -->
  <div id="menu-container"></div>

  <!-- Top Right Fullscreen Button -->
  <button id="btn-fullscreen-toggle" class="btn-fullscreen" title="Full Screen Mode (F11)">
    <svg id="icon-fs-enter" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
    <svg id="icon-fs-exit" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
    </svg>
  </button>

  <!-- Main Game Entry Point -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
